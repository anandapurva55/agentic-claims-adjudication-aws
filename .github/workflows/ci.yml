name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Lint, tests and eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Generate golden data (deterministic, seeded)
        run: python scripts/generate_data.py
      - name: Lint
        run: ruff check backend infra evals redteam scripts docs
      - name: Types
        run: mypy backend/app
      - name: All tests (backend, evaluation gate, fine-tuning data), exactly as a developer runs them
        run: pytest -q
      - name: Evaluate against the golden set
        run: python evals/run_eval.py --mode replay
      - name: Quality gate (fails the pull request when quality drops)
        run: python evals/gate.py --mode replay
      - name: Red team (offline)
        run: python redteam/run.py --mode replay
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: eval-reports, path: "evals/reports redteam/reports" }

  frontend:
    name: Type check and build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build

  infra:
    name: CDK synth
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: pip install -r requirements-dev.txt
      - run: python scripts/generate_data.py
      - run: cd frontend && npm ci && npm run build
      - name: Security properties of the synthesised stack (internal ALB, VPC origin, scoped IAM)
        run: pytest infra/tests -q
      - name: Synthesize (no AWS lookups, so no credentials are needed)
        working-directory: infra
        env: { CDK_DEFAULT_ACCOUNT: "000000000000", CDK_DEFAULT_REGION: us-east-1 }
        run: npx --yes aws-cdk@2 synth --quiet --no-lookups -c account=000000000000
