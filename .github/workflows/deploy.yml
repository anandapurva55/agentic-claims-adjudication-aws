name: Deploy

on:
  workflow_dispatch:
    inputs:
      mode: { description: "replay or live", default: "live", type: choice, options: [live, replay] }

permissions:
  id-token: write
  contents: read

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-python@v7
        with: { python-version-file: .python-version }
      - uses: astral-sh/setup-uv@v10.3.3
        with: { enable-cache: true, cache-dependency-glob: uv.lock }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Install exactly what uv.lock says
        run: |
          uv sync --locked
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: python scripts/generate_data.py
      - run: cd frontend && npm ci && npm run build
      - name: Deploy both stacks
        working-directory: infra
        run: npx --yes aws-cdk@2 deploy --all --require-approval never -c mode=${{ inputs.mode }}
