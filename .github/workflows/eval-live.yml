name: Live eval and red team

# Runs the real Bedrock agents against the golden set and the 20 attacks. Costs money, so it is manual or nightly.
on:
  workflow_dispatch:
  # Add a nightly schedule (cron) once the AWS_EVAL_ROLE_ARN repository variable points at an OIDC role. Without it a scheduled run would fail.

permissions:
  id-token: write
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_EVAL_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python scripts/generate_data.py
      - name: Evaluate the agents
        env: { CLAIMS_MODE: live, CLAIMS_GUARDRAIL_ID: "${{ vars.GUARDRAIL_ID }}", CLAIMS_KNOWLEDGE_BASE_ID: "${{ vars.KB_ID }}" }
        run: python evals/run_eval.py --mode live
      - name: Gate (zero unsafe approvals)
        run: python evals/gate.py --mode live
      - name: Red team against live agents
        env: { CLAIMS_MODE: live, CLAIMS_GUARDRAIL_ID: "${{ vars.GUARDRAIL_ID }}", CLAIMS_KNOWLEDGE_BASE_ID: "${{ vars.KB_ID }}" }
        run: python redteam/run.py --mode live
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: live-reports, path: "evals/reports redteam/reports" }
