# Keeps every dependency current and surfaces security fixes as pull requests. Each ecosystem is checked weekly; security updates open immediately.
version: 2
updates:
  - package-ecosystem: uv  # reads pyproject.toml and updates uv.lock together
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend-minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /docs/demo
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
